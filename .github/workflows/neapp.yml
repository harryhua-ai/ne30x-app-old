name: NEAPP05 Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Repository release version (vX.Y.Z); leave empty for verification only'
        required: false
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/neapp-unsigned-evidence"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.5.2

      - name: Install ARM compiler and H.264 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi ffmpeg

      - name: Install Python verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==48.0.0

      - name: Prepare browser test dependencies
        run: |
          pnpm --dir tests/line-crossing-ui install --frozen-lockfile --ignore-scripts
          npm ci --prefix tests/line-crossing-ui/browser-runner --ignore-scripts
          npx --yes playwright@1.64.0 install --with-deps chromium

      - name: Run UI, H.264, runtime, bridge, and NEAPP05 positive and negative acceptance
        shell: bash
        run: |
          set -o pipefail
          export LC_SAVE_DIAGNOSTIC_MODE=matrix
          export LC_SAVE_EVIDENCE_PATH="$RUNNER_TEMP/neapp-unsigned-evidence/line-save-diagnostics.json"
          pnpm --dir tests/line-crossing-ui test 2>&1 | tee "$RUNNER_TEMP/neapp-unsigned-evidence/ui-runtime-bridge.log"
          python -m unittest discover -s tests/unsigned -v 2>&1 | tee "$RUNNER_TEMP/neapp-unsigned-evidence/unsigned-format.log"
          python -m unittest discover -s tests/release -v 2>&1 | tee "$RUNNER_TEMP/neapp-unsigned-evidence/release-unit.log"

      - name: Build and independently verify the production candidate package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/neapp-unsigned-evidence"
          native=$(make -C apps/line-crossing/app -s print-v4_app_version)
          bash package/release/build_neapp.sh --out-dir "$RUNNER_TEMP/neapp-candidate" \
            --source-sha "$GITHUB_SHA"
          package="$RUNNER_TEMP/neapp-candidate/line-crossing-$native.neapp"
          python - "$package.provenance.json" > "$evidence_dir/candidate-metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          provenance = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps({
              "artifact": "neapp-v5-unsigned CI candidate (not an official Release)",
              "app_id": provenance["app_id"],
              "native_version": provenance["native_version"],
              "ui_version": provenance["ui_version"],
              "package_sha256": provenance["package"]["sha256"],
              "source_commit": provenance["source_commit"],
          }, indent=2, sort_keys=True))
          PY
          echo "NEAPP_CI_CANDIDATE_DIR=$RUNNER_TEMP/neapp-candidate" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: neapp-ci-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neapp-candidate/*.neapp
            ${{ runner.temp }}/neapp-candidate/*.neapp.sha256
            ${{ runner.temp }}/neapp-candidate/*.neapp.provenance.json
            ${{ runner.temp }}/neapp-candidate/*.verification.json
            ${{ runner.temp }}/neapp-candidate/candidate.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record verification run metadata
        if: always()
        env:
          VERIFICATION_RESULT: ${{ job.status }}
        run: |
          python - "$RUNNER_TEMP/neapp-unsigned-evidence/ci-summary.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "workflow": "NEAPP Unsigned Verification",
              "result": os.environ["VERIFICATION_RESULT"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "signing_inputs_required": False,
              "installable_neapp_artifact_uploaded": True,
              "installable_neapp_artifact": "neapp-ci-candidate (CI candidate, not an official Release)",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neapp-unsigned-verification-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neapp-unsigned-evidence/*.json
            ${{ runner.temp }}/neapp-unsigned-evidence/*.log
            ${{ runner.temp }}/neapp-unsigned-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.5.2

      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Validate release version input
        run: |
          set -euo pipefail
          python3 package/release/release_tool.py validate-version \
            --version "$RELEASE_INPUT"
          echo "RELEASE_VERSION=$RELEASE_INPUT" >> "$GITHUB_ENV"

      - name: Resolve packaged versions from the Makefile
        run: |
          set -euo pipefail
          native=$(make -C apps/line-crossing/app -s print-v4_app_version)
          echo "PKG_DIR=apps/line-crossing/app/build/pkg" >> "$GITHUB_ENV"
          echo "PACKAGE=apps/line-crossing/app/build/pkg/line-crossing-$native.neapp" >> "$GITHUB_ENV"

      - name: Check tag and release conflicts (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 package/release/release_tool.py check-conflicts \
            --version "$RELEASE_VERSION" \
            --repo-slug '${{ github.repository }}'

      - name: Build production candidate package
        run: |
          set -euo pipefail
          bash package/release/build_neapp.sh --source-sha "$(git rev-parse HEAD)"

      - name: Generate English release notes
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            range="$(git describe --tags --abbrev=0)..HEAD"
            git log --format='%s' "$range" > "$RUNNER_TEMP/commits.txt"
          else
            git log --format='%s' -n 50 > "$RUNNER_TEMP/commits.txt"
          fi
          python3 package/release/release_tool.py notes \
            --repo-version "$RELEASE_VERSION" \
            --provenance "$PACKAGE.provenance.json" \
            --verification "${PACKAGE%.neapp}.verification.json" \
            --known-limitations package/release/known-limitations.md \
            --commits-file "$RUNNER_TEMP/commits.txt" \
            --out "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create unpublished draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          url=$(python3 package/release/release_tool.py create-draft \
            --version "$RELEASE_VERSION" \
            --target-sha "$target_sha" \
            --title "line-crossing $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --assets "$PACKAGE" "$PACKAGE.sha256" \
                     "$PACKAGE.provenance.json" \
                     "${PACKAGE%.neapp}.verification.json")
          echo "Draft release created (not published) at main commit $target_sha: $url"
          echo "Publishing requires a separate per-version User Release GO."
